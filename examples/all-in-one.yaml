# =============================================================================
# BunkerWeb Helm Chart - All-in-One Example
# =============================================================================
# Full stack for testing and small setups: BunkerWeb + Scheduler + Controller
# + UI + API + internal MariaDB + internal Redis + internal Prometheus
# (requires BunkerWeb PRO license) + internal Grafana.
#
# This file lists ONLY the values that differ from the chart defaults in
# charts/bunkerweb/values.yaml. See docs/values.md for the full reference.
#
# Install:
#   helm install bunkerweb-aio bunkerweb/bunkerweb -f examples/all-in-one.yaml
#
# Access:
#   - BunkerWeb Instance: http://<NODE_IP>:8080 or https://<NODE_IP>:8443
#   - BunkerWeb UI: kubectl port-forward svc/ui-bunkerweb-test 7000:7000 or http://bunkerweb-ui.example.com
#   - BunkerWeb API: http://bunkerweb-api.example.com
#   - Grafana: kubectl port-forward svc/grafana-bunkerweb-test 3000:3000 or http://grafana.example.com
#   - Prometheus: kubectl port-forward svc/prometheus-bunkerweb-test 9090:9090
# =============================================================================

settings:
  ui:
    ingress:
      enabled: true
      ingressClassName: bunkerweb
      serverName: bunkerweb-ui.example.com
  api:
    useBearerToken:
      fromExistingSecret: true
      token: my-super-secure-api-bearer-token
    ingress:
      enabled: true
      ingressClassName: bunkerweb
      serverName: bunkerweb-api.example.com
service:
  type: NodePort
bunkerweb:
  hostPorts: false
  pullPolicy: Always
  service:
    headless: false
scheduler:
  pullPolicy: Always
  usePrometheusExporter: true
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
controller:
  pullPolicy: Always
  livenessProbe:
    initialDelaySeconds: 60
  readinessProbe:
    initialDelaySeconds: 60
ui:
  pullPolicy: Always
  logs:
    pullPolicy: Always
api:
  enabled: true
  pullPolicy: Always
mariadb:
  pullPolicy: Always
redis:
  pullPolicy: Always
  useConfigFile: false
prometheus:
  enabled: true
  pullPolicy: Always
grafana:
  enabled: true
  adminPassword: changeme
  ingress:
    enabled: true
    ingressClassName: bunkerweb
    serverName: grafana.example.com
    serverPath: /
    tlsSecretName: ''
    annotations: {}
