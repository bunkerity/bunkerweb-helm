# =============================================================================
# BunkerWeb Helm Chart - Minimal Example
# =============================================================================
# Production-like setup using external services: BunkerWeb Deployment (1
# replica) + Scheduler + Controller + UI, with an external MariaDB database
# and external Redis cache/monitoring (fill in the placeholder values below).
#
# This file lists ONLY the values that differ from the chart defaults in
# charts/bunkerweb/values.yaml. See docs/values.md for the full reference.
#
# Install:
#   helm install bunkerweb bunkerweb/bunkerweb -f examples/minimal.yaml
# =============================================================================

settings:
  misc:
    databaseUri: fill-in-your-external-mariadb-uri-here-or-use-settings.existingSecret
  redis:
    redisHost: fill-in-your-external-redis-host
  ui:
    wizard: false
bunkerweb:
  hostPorts: false
  pullPolicy: Always
  service:
    headless: false
  pdb:
    create: false
scheduler:
  pullPolicy: Always
  usePrometheusExporter: true
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
controller:
  pullPolicy: Always
  readinessProbe:
    initialDelaySeconds: 30
ui:
  pullPolicy: Always
  logs:
    pullPolicy: Always
api:
  pullPolicy: Always
mariadb:
  enabled: false
redis:
  enabled: false
