# =============================================================================
# BunkerWeb Helm Chart - MCP Integration Example
# =============================================================================
# Configures the MCP (Model Context Protocol) server for AI assistant
# integration (Claude Code, etc.). Based on minimal.yaml with the MCP server
# and the BunkerWeb API (required by MCP) enabled.
#
# SECURITY WARNING:
# The MCP server has no built-in authentication for the /mcp endpoint.
# You MUST secure access using one of these methods:
# - IP whitelisting via BunkerWeb annotations
# - Network policies
# - Not exposing externally (use kubectl port-forward)
#
# This file lists ONLY the values that differ from the chart defaults in
# charts/bunkerweb/values.yaml. See docs/values.md for the full reference.
#
# Install:
#   helm install bunkerweb bunkerweb/bunkerweb -f examples/mcp-integration.yaml
#
# Usage:
#   1. Deploy: helm install bunkerweb bunkerweb/bunkerweb -f examples/mcp-integration.yaml
#   2. Access MCP locally: kubectl port-forward svc/mcp-bunkerweb 8080:8080
#   3. Configure Claude Code MCP settings with: http://localhost:8080/mcp
# =============================================================================

settings:
  misc:
    databaseUri: fill-in-your-external-mariadb-uri-here-or-use-settings.existingSecret
  redis:
    redisHost: fill-in-your-external-redis-host
  ui:
    wizard: false
bunkerweb:
  hostPorts: false
  pullPolicy: Always
  service:
    headless: false
  pdb:
    create: false
scheduler:
  pullPolicy: Always
  usePrometheusExporter: true
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
controller:
  pullPolicy: Always
  readinessProbe:
    initialDelaySeconds: 30
ui:
  pullPolicy: Always
  logs:
    pullPolicy: Always
api:
  enabled: true
  pullPolicy: Always
mcp:
  enabled: true
  tag: v0.1.0
  config:
    requestTimeout: 30
    maxRetries: 3
    enableDnsRebindingProtection: true
    allowedHosts: localhost,127.0.0.1,mcp.example.com
    allowedOrigins: '*'
    cacheEnabled: true
  secrets:
    bunkerwebApiToken: your-secure-api-token-here
  ingress:
    serverName: mcp.example.com
    annotations:
      bunkerweb.io/USE_WHITELIST: 'yes'
      bunkerweb.io/WHITELIST_IP: 10.0.0.0/8 192.168.0.0/16
    tls:
      enabled: true
      secretName: mcp-tls-secret
  httpRoutes:
    serverName: mcp.example.com
    extraAnnotations:
      bunkerweb.io/USE_WHITELIST: 'yes'
      bunkerweb.io/WHITELIST_IP: 10.0.0.0/8 192.168.0.0/16
mariadb:
  enabled: false
redis:
  enabled: false
