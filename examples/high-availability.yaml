# =============================================================================
# BunkerWeb Helm Chart - High Availability Example
# =============================================================================
# Production HA setup: BunkerWeb Deployment with multiple replicas, HPA,
# PodDisruptionBudget, topology spread constraints, resource requests/limits,
# and tuned readiness/liveness probes. Includes BunkerWeb Core + Scheduler +
# Controller + API + UI + internal MariaDB (swap for external DB) + internal
# Redis (swap for external Redis).
#
# This file lists ONLY the values that differ from the chart defaults in
# charts/bunkerweb/values.yaml. See docs/values.md for the full reference.
#
# Install:
#   helm install bunkerweb bunkerweb/bunkerweb -f examples/high-availability.yaml
# =============================================================================

topologySpreadConstraints:
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app: bunkerweb
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app: bunkerweb
settings:
  existingSecret: bunkerweb-settings-secret.yaml
  redis:
    redisHost: redis-bunkerweb.bunkerweb.svc.cluster.local
  ui:
    wizard: false
  api:
    useBearerToken:
      fromExistingSecret: true
bunkerweb:
  hostPorts: false
  replicas: 3
  pullPolicy: Always
  resources:
    requests:
      cpu: 900m
      memory: 4096Mi
    limits:
      cpu: 2000m
      memory: 8192Mi
  hpa:
    enabled: true
  service:
    headless: false
  pdb:
    minAvailable: '1'
    maxUnavailable: '2'
scheduler:
  pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
controller:
  pullPolicy: Always
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 60
  readinessProbe:
    initialDelaySeconds: 60
ui:
  pullPolicy: Always
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 700m
      memory: 2048Mi
  logs:
    pullPolicy: Always
api:
  enabled: true
  pullPolicy: Always
mariadb:
  pullPolicy: Always
redis:
  pullPolicy: Always
  useConfigFile: false
prometheus:
  pullPolicy: Always
