{{- $replicas := int .Values.bunkerweb.replicas }}
{{- if and .Values.bunkerweb.enabled .Values.bunkerweb.pdb.create (gt $replicas 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name:  {{ include "bunkerweb.fullname" . }}
  namespace: {{ include "bunkerweb.namespace" . }}
  labels:
    {{- include "bunkerweb.labels" . | nindent 4 }}
spec:
  {{- /* Kubernetes accepts only one of the two fields: minAvailable wins when set. Only null and "" mean unset: 0 is a real budget. */}}
  {{- $min := .Values.bunkerweb.pdb.minAvailable }}
  {{- $max := .Values.bunkerweb.pdb.maxUnavailable }}
  {{- if not (or (kindIs "invalid" $min) (eq (toString $min) "")) }}
  minAvailable: {{ $min }}
  {{- else if or (kindIs "invalid" $max) (eq (toString $max) "") }}
  maxUnavailable: 1
  {{- else }}
  maxUnavailable: {{ $max }}
  {{- end }}
  selector:
    matchLabels:
      bunkerweb.io/component: "bunkerweb"
{{- end }}
