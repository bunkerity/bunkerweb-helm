{{- if .Values.controller.enabled -}}
{{- if and .Values.settings.kubernetes.sslCaCert (not .Values.controller.volumeMounts) }}
{{- fail (printf "settings.kubernetes.sslCaCert is set to %q but controller.volumeMounts is empty. The CA bundle must be mounted into the controller container at that path (BunkerWeb loads it unconditionally, even when verifySsl=no). Add controller.volumes + controller.volumeMounts, or unset sslCaCert to use the default service-account CA." .Values.settings.kubernetes.sslCaCert) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-{{ include "bunkerweb.fullname" . }}
  namespace: {{ include "bunkerweb.namespace" . }}
  labels:
    {{- include "bunkerweb.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "bunkerweb.selectorLabels" . | nindent 6 }}
      bunkerweb.io/component: "controller"
  template:
    metadata:
      labels:
        {{- include "bunkerweb.labels" . | nindent 8 }}
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        bunkerweb.io/component: "controller"
    spec:
      serviceAccountName: {{ include "bunkerweb.fullname" . }}
      {{- with .Values.controller.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bunkerweb-controller
          image: {{ .Values.controller.repository }}:{{ .Values.controller.tag }}
          imagePullPolicy: {{ .Values.controller.pullPolicy }}
          {{- with .Values.controller.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- with .Values.controller.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- with .Values.controller.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12}}
          {{- end }}
          env:
            # Mandatory for k8s integration
            - name: KUBERNETES_MODE
              value: "yes"
            - name: KUBERNETES_REVERSE_PROXY_SUFFIX_START
              value: "0"
            {{- if .Values.gatewayClass.enabled }}
            - name: KUBERNETES_GATEWAY_MODE
              value: "yes"
            {{- end }}
            - name: DATABASE_URI
              {{- if not (empty .Values.settings.existingSecret) }}
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.settings.existingSecret }}"
                  key: database-uri
              {{- else }}
              value: "{{ include "bunkerweb.databaseUri" . }}"
              {{- end }}
            - name: NAMESPACES
              value: "{{ .Values.settings.kubernetes.namespaces }}"
            - name: KUBERNETES_INGRESS_CLASS
              value: "{{ .Values.settings.kubernetes.ingressClass }}"
            - name: KUBERNETES_DOMAIN_NAME
              value: "{{ .Values.settings.kubernetes.domainName }}"
            - name: KUBERNETES_IGNORE_ANNOTATIONS
              value: "{{ .Values.settings.kubernetes.ignoreAnnotations }}"
            {{- if .Values.settings.kubernetes.verifySsl }}
            - name: KUBERNETES_VERIFY_SSL
              value: "{{ .Values.settings.kubernetes.verifySsl }}"
            {{- end }}
            {{- if .Values.settings.kubernetes.sslCaCert }}
            - name: KUBERNETES_SSL_CA_CERT
              value: "{{ .Values.settings.kubernetes.sslCaCert }}"
            {{- end }}
            {{- if and .Values.gatewayClass.enabled .Values.settings.kubernetes.gatewayApiVersion }}
            - name: KUBERNETES_GATEWAY_API_VERSION
              value: "{{ .Values.settings.kubernetes.gatewayApiVersion }}"
            {{- end }}
            {{- if .Values.settings.kubernetes.useFqdn }}
            - name: USE_KUBERNETES_FQDN
              value: "{{ .Values.settings.kubernetes.useFqdn }}"
            {{- end }}
            {{- if .Values.settings.kubernetes.serviceProtocol }}
            - name: KUBERNETES_SERVICE_PROTOCOL
              value: "{{ .Values.settings.kubernetes.serviceProtocol }}"
            {{- end }}
            - name: BUNKERWEB_SERVICE_NAME
              value: "{{ include "bunkerweb.fullname" . }}-external"
            - name: BUNKERWEB_NAMESPACE
              value: "{{ include "bunkerweb.namespace" . }}"
            {{- /* Guard on emptiness, not truthiness: 0 is a valid value that disables the worker. */}}
            {{- if ne (toString .Values.controller.settingsRecheckInterval) "" }}
            - name: AUTOCONF_SETTINGS_RECHECK_INTERVAL
              value: {{ .Values.controller.settingsRecheckInterval | quote }}
            {{- end }}
            {{- if .Values.controller.extraEnvs }}
            {{- toYaml .Values.controller.extraEnvs | nindent 12 }}
            {{- end }}
            {{- include "bunkerweb.logEnvs" . }}
          {{- with .Values.controller.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- include "bunkerweb.podNodeTolerations" (dict "comp" .Values.controller "root" .Values) }}
    {{- include "bunkerweb.podImagePullSecrets" (dict "comp" .Values.controller "root" .Values) }}
      {{- with .Values.controller.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
