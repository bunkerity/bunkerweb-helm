{{- if and .Values.bunkerweb.enabled (eq (.Values.bunkerweb.kind | default "DaemonSet") "DaemonSet") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "bunkerweb.fullname" . }}
  namespace: {{ include "bunkerweb.namespace" . }}
  labels:
    {{- include "bunkerweb.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "bunkerweb.selectorLabels" . | nindent 6 }}
      bunkerweb.io/component: "bunkerweb"
  template:
    metadata:
      annotations:
        # mandatory annotation
        {{- if .Values.bunkerweb.enableInstance | default true }}
        bunkerweb.io/INSTANCE: "yes"
        {{- end }}
      {{- with .Values.bunkerweb.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bunkerweb.labels" . | nindent 8 }}
        {{- with .Values.bunkerweb.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        bunkerweb.io/component: "bunkerweb"
    spec:
    {{- with .Values.bunkerweb.affinity }}
      affinity:
      {{- toYaml . | nindent 8}}
    {{- end }}
      {{- with .Values.bunkerweb.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # using bunkerweb as name is mandatory
        - name: bunkerweb
          image: {{ .Values.bunkerweb.repository }}:{{ .Values.bunkerweb.tag }}
          imagePullPolicy: {{ .Values.bunkerweb.pullPolicy }}
          {{- with .Values.bunkerweb.resources }}
          resources:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- with .Values.bunkerweb.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12}}
          {{- end }}
          ports:
            - containerPort: 8080
              {{- if .Values.bunkerweb.hostPorts }}
              hostPort: 80
              {{- end }}
            - containerPort: 8443
              {{- if .Values.bunkerweb.hostPorts }}
              hostPort: 443
              {{- end }}
            {{- if and .Values.bunkerweb.usePrometheusExporter }}
            - containerPort: 9113
              name: metrics
            {{- end }}
          env:
            {{- include "bunkerweb.commonEnv" . | nindent 12 }}
          {{- if .Values.bunkerweb.extraEnvs }}
            {{- toYaml .Values.bunkerweb.extraEnvs | nindent 12 }}
          {{- end }}
          {{- with .Values.bunkerweb.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- with .Values.bunkerweb.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- with .Values.bunkerweb.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- include "bunkerweb.podNodeTolerations" (dict "comp" .Values.bunkerweb "root" .Values) }}
    {{- include "bunkerweb.podImagePullSecrets" (dict "comp" .Values.bunkerweb "root" .Values) }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bunkerweb.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}