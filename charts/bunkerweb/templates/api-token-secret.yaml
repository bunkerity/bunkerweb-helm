{{- if eq (include "bunkerweb.apiTokenSource" .) "generated" }}
{{- $secretName := printf "%s-api-token" (include "bunkerweb.fullname" .) }}
{{- $existing := lookup "v1" "Secret" (include "bunkerweb.namespace" .) $secretName }}
{{- $token := randAlphaNum 48 }}
{{- if and $existing $existing.data (hasKey $existing.data "api-token") }}
{{- $token = index $existing.data "api-token" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "bunkerweb.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-token: {{ $token | b64enc | quote }}
{{- end }}
