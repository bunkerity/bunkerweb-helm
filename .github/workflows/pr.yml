name: Validate pull request

# Validation only: no packaging, no publishing, no deployment credentials.
# Publication workflows have no pull_request trigger and are not reachable from this workflow.
on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Run Plumber (advisory)
        continue-on-error: true
        uses: getplumber/plumber@d37150cee04d6627497cb4c6a553ef9a2d6c7548 # v0.5.2
        with:
          verify-attestation: true
          config-file: .github/plumber/plumber.yaml
          min-score: B
          soft-fail: true
          upload-sarif: false
          score-push: false
          upload-artifacts: true

  validate:
    runs-on: ubuntu-latest
    name: Validate Chart
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run Chart Validation
        run: ./scripts/validate-chart.sh
