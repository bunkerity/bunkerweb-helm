name: Deploy helm chart to dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "charts/**"

jobs:
  plumber:
    uses: ./.github/workflows/plumber.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  validate:
    runs-on: ubuntu-latest
    name: Validate Chart Before Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run Chart Validation
        run: ./scripts/validate-chart.sh

  deploy:
    runs-on: ubuntu-latest
    needs: [plumber, validate]
    if: success()
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        id: install

      - name: Package chart and push it
        env:
          REPO_BEARER_TOKEN: ${{ secrets.REPO_BEARER_TOKEN }}
        run: ./scripts/publish-chart.sh dev
