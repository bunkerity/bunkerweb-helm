name: Release Helm chart (tag push)

permissions: read-all

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to see draft releases as well as published ones.
      actions: read # Required to inspect release environment protection.
    outputs:
      version: ${{ steps.release.outputs.version }}
      app_version: ${{ steps.release.outputs.app_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release tag and repository state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="$(awk '$1 == "version:" { print $2; exit }' charts/bunkerweb/Chart.yaml)"
          APP_VERSION="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' charts/bunkerweb/Chart.yaml)"
          test -n "$VERSION"
          test -n "$APP_VERSION"

          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "::error::tag $TAG does not match chart version $VERSION; expected v${VERSION}"
            exit 1
          fi

          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          OBJ_TYPE="$(printf '%s' "$TAG_REF" | jq -r '.object.type')"
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          if [[ "$OBJ_TYPE" != "tag" ]]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"
            exit 1
          fi

          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}")"
          if ! printf '%s' "$TAG_OBJECT" | jq -e --arg sha "$GITHUB_SHA" \
            '.verification.verified == true and .object.type == "commit" and .object.sha == $sha' >/dev/null; then
            echo "::error::$TAG is unsigned, unverified, or does not target the triggering commit"
            exit 1
          fi

          if ! gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -e --arg tag "$TAG" 'type == "array" and all(.[]; type == "array") and all(.[][]; (.tag_name | type) == "string" and .tag_name != $tag)' >/dev/null; then
            echo "::error::release $TAG already exists (including drafts), or its absence cannot be verified"
            exit 1
          fi

          if ! awk -v want="$TAG" '$1 == "##" && $2 == want { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '$TAG' section"
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/environments/release" |
            jq -e '.name == "release" and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0 and all(.reviewers[]; .type == "User" and (.reviewer.login | IN("TheophileDiot", "fl0ppy-d1sk"))))' >/dev/null

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "app_version=$APP_VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  plumber:
    needs: prepare
    uses: ./.github/workflows/plumber.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate and package chart
        run: |
          set -euo pipefail
          ./scripts/validate-chart.sh
          mkdir dist
          helm package ./charts/bunkerweb --destination dist

      - name: Upload candidate chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart-${{ needs.prepare.outputs.version }}
          path: dist/bunkerweb-${{ needs.prepare.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    needs: [prepare, plumber, candidate]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Recheck release authorization
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" |
            jq -e '.name == "release" and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0 and all(.reviewers[]; .type == "User" and (.reviewer.login | IN("TheophileDiot", "fl0ppy-d1sk"))))' >/dev/null
          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(printf '%s' "$TAG_REF" | jq -r '.object.type')" = tag
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" |
            jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha' >/dev/null

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, candidate, gate]
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Build release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          start_line="$(awk -v want="v${VERSION}" '$1 == "##" && $2 == want { print NR; exit }' CHANGELOG.md)"
          end_line="$(awk -v start="$start_line" 'NR > start && /^## v/ { print NR; exit }' CHANGELOG.md)"
          {
            echo "BunkerWeb Helm chart \`v${VERSION}\` (app version \`${APP_VERSION}\`)."
            echo
            echo '```bash'
            echo 'helm repo add bunkerweb https://repo.bunkerweb.io/charts'
            echo 'helm repo update'
            echo "helm install bunkerweb bunkerweb/bunkerweb --version ${VERSION}"
            echo '```'
            echo
            echo 'Documentation: https://docs.bunkerweb.io/'
            echo
            echo 'Changelog:'
            awk -v start="$start_line" -v end="${end_line:-0}" 'NR > start && (end == 0 || NR < end)' CHANGELOG.md
          } > release-notes.md

      - name: Create draft release and attach candidate
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: v${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body_path: release-notes.md
          files: dist/bunkerweb-${{ needs.prepare.outputs.version }}.tgz
          fail_on_unmatched_files: true

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, candidate, release]
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Publish candidate chart
        env:
          REPO_BEARER_TOKEN: ${{ secrets.REPO_BEARER_TOKEN }}
        run: ./scripts/publish-chart.sh prod "dist/bunkerweb-${{ needs.prepare.outputs.version }}.tgz"
